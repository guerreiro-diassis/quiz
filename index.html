<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>
<body class="page">
    <main class="quiz">
        <h1 class="quiz__title">Quiz</h1>
        <p class="quiz__subtitle">Teste seu conhecimento com nosso quiz!</p>
        <div class="quiz__score">
            <p class="quiz__score-text">Pontuação <span id="score" class="quiz__score-value">0</span></p>
        </div>

        <button id="start-quiz" class="quiz__btn quiz__btn--start" type="button">Iniciar Quiz</button>
        
        <form id="question1" class="quiz__question quiz__question--hidden">
            <p class="quiz__question-label">Questão 1</p>
            <p class="quiz__question-text">Qual é a capital do Brasil?</p>
            <div class="quiz__options">
                <button class="quiz__option">Rio de Janeiro</button>
                <button class="quiz__option">Brasília</button>
                <button class="quiz__option">São Paulo</button>
                <button class="quiz__option">Tocantins</button>
                <button class="quiz__option">Paraná</button>
                <button class="quiz__option">Santa Catarina</button>
            </div>
        </form>

        <form id="question2" class="quiz__question quiz__question--hidden">
            <p class="quiz__question-label">Questão 2</p>
            <p class="quiz__question-text">Qual é o menor estado do Brasil?</p>
            <div class="quiz__options">
                <button class="quiz__option">São Paulo</button>
                <button class="quiz__option">Rio de Janeiro</button>
                <button class="quiz__option">Brasília</button>
                <button class="quiz__option">Tocantins</button>
                <button class="quiz__option">Paraná</button>
                <button class="quiz__option">Santa Catarina</button>
            </div>
        </form>

        <form id="question3" class="quiz__question quiz__question--hidden">
            <p class="quiz__question-label">Questão 3</p>
            <p class="quiz__question-text">Qual é o maior estado do Brasil?</p>
            <div class="quiz__options">
                <button class="quiz__option">São Paulo</button>
                <button class="quiz__option">Rio de Janeiro</button>
                <button class="quiz__option">Brasília</button>
                <button class="quiz__option">Tocantins</button>
                <button class="quiz__option">Paraná</button>
                <button class="quiz__option">Santa Catarina</button>
            </div>
        </form>

        <button id="finish-quiz" class="quiz__btn quiz__btn--start quiz__btn--hidden" type="button">Finalizar Quiz</button>
    </main>

    <script src="scripts/quiz.js"></script>
</body>
</html>
